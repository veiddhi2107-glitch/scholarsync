{% extends "base.html" %}

{% block title %}Sign In — ScholarSync{% endblock %}

{% block content %}
  <div class="card" style="max-width: 440px; margin: 0 auto;">
    <span class="badge-teal" style="margin-bottom: 0.75rem;">Welcome Back</span>
    <h1 style="font-size: 1.7rem; font-weight: 800; color: var(--navy); margin-bottom: 0.35rem;">
      Sign In to ScholarSync
    </h1>
    <p style="color: var(--slate); margin-bottom: 1.35rem;">
      Access your dashboard, saved opportunities, and deadlines.
    </p>

    <form method="POST" action="{{ url_for('login') }}" style="display: grid; gap: 1rem;">
      <div>
        <label style="display: block; font-weight: 600; color: var(--navy); margin-bottom: 0.3rem;">Email Address</label>
        <input type="email" name="email" required value="{{ email }}"
               style="width: 100%; padding: 0.65rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;" />
      </div>

      <div>
        <label style="display: block; font-weight: 600; color: var(--navy); margin-bottom: 0.3rem;">Password</label>
        <input type="password" name="password" required
               style="width: 100%; padding: 0.65rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;" />
      </div>

      <button type="submit" class="btn btn-primary" style="padding: 0.72rem 1.3rem;">Sign In</button>
    </form>

    <p style="margin-top: 1.1rem; color: var(--slate); font-size: 0.93rem;">
      New to ScholarSync? <a href="{{ url_for('register') }}" style="color: var(--teal); font-weight: 600; text-decoration: none;">Create an account</a>
    </p>
  </div>
{% endblock %}
